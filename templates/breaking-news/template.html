{% extends "_layout.html" %}
{% block head %}
<style>
  .headline { font-size: 150px; max-height: 400px; overflow: hidden; }
  .body-text { margin-top: 32px; max-height: 220px; overflow: hidden; }
</style>
{% endblock %}
{% block content %}
<div class="wall">
  <div class="chip">{{ post.get('kicker') or s.breaking }}</div>
  <div class="headline display fit">{{ post.headline }}</div>
  {% if post.get('body') %}<div class="body-text fit">{{ post.body }}</div>{% endif %}
</div>
{% endblock %}
{% block footer %}<b>{{ post.date | longdate }}</b>{% endblock %}
